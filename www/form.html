<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pass saver - New Site</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <nav>
    <div class="top-bar">
      <div class="website-title">
        <h1>Pass saver</h1>
      </div>
      <div class="nav-links">
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="form-container">
    <div class="form-card">
      <h2>Add new site</h2>
      <form id="site-form">

        <div class="form-group">
          <label for="site-category">Category</label>
          <select id="site-category" required>
            <option value="">Select a category...</option>
          </select>
        </div>


        <div class="form-group">
          <label for="site-name">Name</label>
          <input type="text" id="site-name" placeholder="Ej: Twitter, Facebook..." required>
        </div>


        <div class="form-group">
          <label for="site-url">URL</label>
          <input type="url" id="site-url" placeholder="https://ejemplo.com">
        </div>


        <div class="form-group">
          <label for="site-user">User</label>
          <input type="text" id="site-user" placeholder="Nombre de usuario o correo" required>
        </div>


        <div class="form-group">
          <label for="site-password">Password</label>
          <div class="password-row">
            <input type="password" id="site-password" placeholder="Contraseña" required>
            <button type="button" id="btn-generate-password" class="btn-secondary">Generate</button>
          </div>
        </div>


        <div class="form-group">
          <label for="site-description">Description</label>
          <textarea id="site-description" rows="3" placeholder="Notas o descripción del sitio..."></textarea>
        </div>


        <div class="form-actions">
          <a href="index.html" class="btn-cancel">Cancel</a>
          <button type="submit" id="btn-save-site" class="btn-save">Save</button>
        </div>
      </form>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/form.js"></script>
</body>

</html>
